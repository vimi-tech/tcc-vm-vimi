<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FeiraScore - Editar Projeto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap"
          rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            background: #f4f4f4;
            font-family: 'Russo One', sans-serif;
        }

        .navbar-custom {
            background: #000;
            padding: 18px 0;
        }

        .logo {
            color: white;
            font-size: 25px;
            text-decoration: none;
        }

        .logo span {
            color: #b61c1c;
        }

        .btn-voltar {
            color: white;
            background: #b61c1c;
            padding: 10px 25px;
            border-radius: 25px;
            text-decoration: none;
        }

        .page {
            padding: 60px 20px;
        }

        .form-card {
            background: white;
            max-width: 850px;
            margin: auto;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.15);
        }

        .title {
            text-align: center;
            font-size: 36px;
            color: #111;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-family: Arial, sans-serif;
            margin-bottom: 35px;
        }

        .form-label {
            font-weight: bold;
            color: #222;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #ccc;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #b61c1c;
            box-shadow: 0 0 0 0.2rem rgba(182,28,28,0.15);
        }

        .btn-save {
            background: #b61c1c;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 13px 35px;
        }

        .btn-save:hover {
            background: #7a0000;
        }

        .btn-cancel {
            background: #222;
            color: white;
            border-radius: 25px;
            padding: 13px 35px;
            text-decoration: none;
        }

        .btn-cancel:hover {
            background: #444;
            color: white;
        }

    </style>

</head>

<body>

    <nav class="navbar-custom">

        <div class="container d-flex justify-content-between align-items-center">

            <a href="/" class="logo">
                FEIRA<span>SCORE</span>
            </a>

            <a href="/listagem-projetos"
               class="btn-voltar">
                Voltar
            </a>

        </div>

    </nav>


    <main class="page">

        <div class="form-card">

            <h1 class="title">
                Editar Projeto
            </h1>

            <p class="subtitle">
                Alteração dos dados do projeto cadastrado
            </p>


            <form action="/editar-projeto/2" method="POST">


                <div class="mb-4">

                    <label class="form-label">
                        Nome do Projeto
                    </label>

                    <input
                        type="text"
                        name="nome"
                        class="form-control"
                        value="Horta Inteligente"
                        required>

                </div>


                <div class="row">

                    <div class="col-md-6 mb-4">

                        <label class="form-label">
                            Turma
                        </label>

                        <select name="turma"
                                class="form-select">

                            <option>
                                1º Administração
                            </option>

                            <option selected>
                                2º Administração
                            </option>

                            <option>
                                3º Administração
                            </option>

                        </select>

                    </div>


                    <div class="col-md-6 mb-4">

                        <label class="form-label">
                            Categoria
                        </label>

                        <select name="categoria"
                                class="form-select">

                            <option>
                                Tecnologia
                            </option>

                            <option selected>
                                Sustentabilidade
                            </option>

                            <option>
                                Automação
                            </option>

                        </select>

                    </div>

                </div>


                <div class="mb-4">

                    <label class="form-label">
                        Resumo do Projeto
                    </label>

                    <textarea
                        name="resumo"
                        class="form-control"
                        rows="5">Sistema automatizado para monitoramento de uma horta escolar, auxiliando no controle da irrigação.</textarea>

                </div>


                <div class="mb-4">

                    <label class="form-label">
                        Descrição completa
                    </label>

                    <textarea
                        name="descricao"
                        class="form-control"
                        rows="7">A Horta Inteligente utiliza sensores para verificar a umidade do solo e controlar automaticamente a quantidade de água necessária para as plantas.</textarea>

                </div>


                <div class="d-flex justify-content-center gap-3">

                    <a href="/listagem-projetos"
                       class="btn-cancel">
                        Cancelar
                    </a>

                    <button type="submit"
                            class="btn-save">
                        Salvar Alterações
                    </button>

                </div>

            </form>

        </div>

    </main>

</body>

</html>
