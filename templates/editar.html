<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FeiraScore - Editar Projeto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Russo+One&display=swap"
          rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            background: #f4f4f4;
            font-family: 'Russo One', sans-serif;
        }

        .navbar-custom {
            background: #000;
            padding: 18px 0;
        }

        .logo {
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 900;
            text-decoration: none;
        }

        .logo span {
            color: #b61c1c;
        }

        .btn-voltar {
            background: #b61c1c;
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            text-decoration: none;
        }

        .btn-voltar:hover {
            background: #7a0000;
            color: white;
        }

        .page {
            padding: 60px 20px;
        }

        .form-card {
            max-width: 850px;
            margin: auto;
            background: #fff;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 10px 35px rgba(0,0,0,.13);
        }

        .title {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 34px;
            font-weight: 900;
            color: #111;
        }

        .title span {
            color: #b61c1c;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-family: Arial, sans-serif;
            margin-bottom: 35px;
        }

        .form-label {
            font-weight: bold;
            color: #222;
        }

        .form-control {
            border-radius: 12px;
            padding: 13px;
        }

        .form-control:focus {
            border-color: #b61c1c;
            box-shadow: 0 0 0 .2rem rgba(182,28,28,.15);
        }

        .btn-save {
            background: #b61c1c;
            color: #fff;
            border: none;
            border-radius: 25px;
            padding: 13px 30px;
        }

        .btn-save:hover {
            background: #7a0000;
        }

        .btn-cancel {
            background: #111;
            color: #fff;
            border-radius: 25px;
            padding: 13px 30px;
            text-decoration: none;
        }

        .btn-cancel:hover {
            background: #333;
            color: #fff;
        }

    </style>

</head>


<body>

<nav class="navbar-custom">

    <div class="container d-flex justify-content-between align-items-center">

        <a href="{{ url_for('index') }}" class="logo">
            FEIRA<span>SCORE</span>
        </a>

        <a href="{{ url_for('listar_projetos') }}"
           class="btn-voltar">

            Voltar

        </a>

    </div>

</nav>


<main class="page">

    <div class="form-card">

        <h1 class="title">
            Editar <span>Projeto</span>
        </h1>

        <p class="subtitle">
            Altere as informações do projeto cadastrado.
        </p>


        <form
            method="POST"
            action="{{ url_for('editar_projeto', index=index) }}">


            <div class="mb-4">

                <label class="form-label">
                    Nome do Projeto
                </label>

                <input
                    type="text"
                    name="nome"
                    class="form-control"
                    value="{{ estande.nome }}"
                    required>

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Turma
                </label>

                <input
                    type="text"
                    name="turma"
                    class="form-control"
                    value="{{ estande.turma }}"
                    required>

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Resumo do Projeto
                </label>

                <textarea
                    name="resumo"
                    class="form-control"
                    rows="6">{{ estande.resumo }}</textarea>

            </div>


            <div class="d-flex justify-content-center gap-3">

                <a
                    href="{{ url_for('listar_projetos') }}"
                    class="btn-cancel">

                    Cancelar

                </a>


                <button
                    type="submit"
                    class="btn-save">

                    💾 Salvar Alterações

                </button>

            </div>

        </form>

    </div>

</main>

</body>

</html>
