<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeiraScore - Login Estudante</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estudante.css') }}">
</head>

<body>

  <div class="login-container">

    <svg class="avatar-group" viewBox="0 0 100 45" fill="#3c3c3c" stroke="#ffffff" stroke-width="1.4">
      <circle cx="20" cy="22" r="7" />
      <path d="M10,40 C10,30 30,30 30,40" />

      <circle cx="80" cy="22" r="7" />
      <path d="M70,40 C70,30 90,30 90,40" />

      <circle cx="35" cy="18" r="8" />
      <path d="M22,40 C22,28 48,28 48,40" />

      <circle cx="65" cy="18" r="8" />
      <path d="M52,40 C52,28 78,28 78,40" />

      <circle cx="50" cy="14" r="9" fill="#3c3c3c" />
      <path d="M35,40 C35,24 65,24 65,40" fill="#3c3c3c" />
    </svg>

    <p class="welcome-text">Seja bem-vindo de volta!</p>

    <form id="formLogin" onsubmit="return false;">

      <div class="input-group-custom">
        <i class="bi bi-person"></i>
        <input type="text" id="username" name="username" placeholder="charlixcxgod" required autocomplete="off">
      </div>

      <div class="input-group-custom">
        <i class="bi bi-lock"></i>
        <input type="password" id="password" name="password" placeholder="**********" required>
      </div>

      <button type="button" id="btnEntrar" class="btn btn-entrar">Entrar</button>

    </form>

  </div>

  <div id="custom-alert" class="custom-alert-overlay">
    <div class="custom-alert-box">
      <p id="custom-alert-message">Mensagem de aviso...</p>
      <div class="custom-alert-footer">
        <button type="button" id="btnAlertOk" class="btn-alert-ok" onclick="closeCustomAlert()">OK</button>
      </div>
    </div>
  </div>

  <script>
    function showAlert(msg) {
      document.getElementById('custom-alert-message').innerText = msg;
      document.getElementById('custom-alert').classList.add('active');
      setTimeout(() => {
        document.getElementById('btnAlertOk').focus();
      }, 50);
    }

    function closeCustomAlert() {
      document.getElementById('custom-alert').classList.remove('active');
    }

    document.addEventListener('keydown', function (e) {
      const alertOverlay = document.getElementById('custom-alert');
      if (alertOverlay.classList.contains('active')) {
        if (e.key === 'Enter' || e.key === 'Escape') {
          e.preventDefault();
          closeCustomAlert();
        }
      }
    });

    document.getElementById('btnEntrar').addEventListener('click', async function (e) {
      e.preventDefault();

      const campoUsuario = document.getElementById('username');
      const campoCodigo = document.getElementById('password');
      const btnEntrar = document.getElementById('btnEntrar');

      const usuario = campoUsuario.value.trim();
      const codigoDigitado = campoCodigo.value.trim();

      if (!usuario || !codigoDigitado) {
        showAlert("Por favor, preencha o usuário e o código!");
        return;
      }

      btnEntrar.disabled = true;
      btnEntrar.innerText = "Validando...";

      try {
        const response = await fetch('/estandelogin', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            username: usuario,
            password: codigoDigitado
          })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          window.location.href = data.redirect_url;
        } else {
          showAlert(data.message || "Código de turma inválido! Digite o código impresso no papel fornecido.");
          campoCodigo.value = '';
          campoCodigo.focus();
        }
      } catch (err) {
        showAlert("Erro de comunicação com o servidor ao validar o código.");
      } finally {
        btnEntrar.disabled = false;
        btnEntrar.innerText = "Entrar";
      }
    });

    // Permitir submissão rápida com a tecla Enter
    document.getElementById('password').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        document.getElementById('btnEntrar').click();
      }
    });
  </script>

</body>

<div vw class="enabled">
  <div vw-access-button class="active"></div>
  <div vw-plugin-wrapper>
    <div class="vw-plugin-top-wrapper"></div>
  </div>
</div>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
  new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>

</html>
