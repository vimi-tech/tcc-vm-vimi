<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Votação - Pergunta {{ numero_atual }} de {{ total_perguntas }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-dark text-light py-5">
    <div class="container" style="max-width: 600px;">
        <div class="card bg-secondary text-light border-danger p-4 shadow">
            
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="badge bg-danger">Pergunta {{ numero_atual }} / {{ total_perguntas }}</span>
                <small class="text-muted">FeiraScore</small>
            </div>

            <h4 class="mb-4">{{ pergunta }}</h4>

            <form method="POST" action="{{ url_for('exibir_pergunta', numero=numero_atual) }}">
                
                <!-- Seleção do Estande -->
                <div class="mb-3">
                    <label class="form-label">Selecione o Estande/Projeto:</label>
                    <select name="estande" class="form-select bg-dark text-light border-secondary" required>
                        <option value="">Escolha um projeto...</option>
                        {% for estande in estandes %}
                            <option value="{{ estande.turma }}">{{ estande.turma }} - {{ estande.nome }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Avaliação/Nota -->
                <div class="mb-4">
                    <label class="form-label">Sua Nota/Resposta:</label>
                    <div class="d-flex justify-content-between gap-2">
                        {% for nota in range(1, 6) %}
                            <input type="radio" class="btn-check" name="nota" id="nota{{ nota }}" value="{{ nota }}" required>
                            <label class="btn btn-outline-light flex-fill" for="nota{{ nota }}">{{ nota }}</label>
                        {% endfor %}
                    </div>
                </div>

                <button type="submit" class="btn btn-danger w-100 rounded-pill">
                    {% if numero_atual < total_perguntas %}
                        PRÓXIMA PERGUNTA &rarr;
                    {% else %}
                        FINALIZAR VOTAÇÃO &check;
                    {% endif %}
                </button>
            </form>

        </div>
    </div>
</body>
</html>
