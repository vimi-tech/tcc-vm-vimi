<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeiraScore - Editar Projeto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Russo+One&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f4f4f4;
            font-family: 'Russo One', sans-serif;
            min-height: 100vh;
        }

        .navbar-custom {
            background: #000;
            padding: 18px 0;
        }

        .logo {
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 900;
            text-decoration: none;
        }

        .logo span {
            color: #b61c1c;
        }

        .btn-voltar {
            background: #b61c1c;
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn-voltar:hover {
            background: #7a0000;
            color: white;
        }

        .page-container {
            padding: 60px 20px;
            max-width: 800px;
            margin: auto;
        }

        .card-custom {
            background: white;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.1);
            border-top: 6px solid #b61c1c;
        }

        .page-title {
            text-align: center;
            font-size: 32px;
            color: #111;
            margin-bottom: 25px;
        }

        .page-title span {
            color: #b61c1c;
        }

        .form-label {
            font-family: Arial, sans-serif;
            font-weight: bold;
            color: #333;
            margin-top: 15px;
        }

        .form-control {
            font-family: Arial, sans-serif;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #ddd;
        }

        .form-control:focus {
            border-color: #b61c1c;
            box-shadow: 0 0 0 0.25rem rgba(182, 28, 28, 0.25);
        }

        .btn-save {
            background: #b61c1c;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 35px;
            font-size: 16px;
            transition: 0.3s;
            margin-top: 25px;
        }

        .btn-save:hover {
            background: #7a0000;
            color: white;
        }

        .btn-media {
            background: #111;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 25px;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            margin-top: 25px;
            margin-left: 10px;
            transition: 0.3s;
        }

        .btn-media:hover {
            background: #333;
            color: white;
        }
    </style>
</head>

<body>

    <nav class="navbar-custom">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="{{ url_for('index') }}" class="logo">
                FEIRA<span>SCORE</span>
            </a>
            <a href="{{ url_for('listar_projetos') }}" class="btn-voltar">
                Voltar aos Projetos
            </a>
        </div>
    </nav>

    <main class="page-container">

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="mb-4">
            {% for category, message in messages %}
            <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <div class="card-custom">
            <h1 class="page-title">Editar <span>Projeto</span></h1>

            <form method="POST" action="{{ url_for('editar_projeto', index=index) }}">
                <div class="mb-3">
                    <label class="form-label">Nome do Projeto:</label>
                    <input type="text" name="nome" class="form-control" value="{{ estande.nome }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Turma Responsável:</label>
                    <input type="text" name="turma" class="form-control" value="{{ estande.turma }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Resumo do Projeto:</label>
                    <textarea name="resumo" class="form-control" rows="4" required>{{ estande.resumo }}</textarea>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn-save">💾 Salvar Alterações</button>
                    <a href="{{ url_for('editar_midias', index=index) }}" class="btn-media">📸 Gerenciar Mídias</a>
                </div>
            </form>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
